# Harbor & Vale — project settings (non-secret).
#
# Filesystem paths are owned by src/harbor_vale/io_paths.py, NOT this file.
# This file holds tunable, non-secret values only.
# Secrets never live here: OPENAI_API_KEY belongs in .env (gitignored).
# See PROJECT_PLAN.md §B.2, §L, §Q, §R.

project_name: harbor_vale

# Deterministic seeds — PROJECT_PLAN.md §R.1 / §Q.4
seeds:
  python_hash: 0          # exported as PYTHONHASHSEED by the pipeline entrypoint
  numpy: 42
  sklearn_random_state: 42

# LLM configuration — the single place model / provider / temperature are set
# (PROJECT_PLAN.md §L "המקום היחיד שבו LLM מוגדר", §V.2 N2, §Q.4).
# config/llm.py reads this block. The API key itself is read from the environment
# variable named below, at execution time only — never stored here.
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.1
  api_key_env: OPENAI_API_KEY

# Logging levels — PROJECT_PLAN.md §Q.1 (console INFO, file DEBUG).
# src/harbor_vale/logging_setup.py defaults match these.
logging:
  console_level: INFO
  file_level: DEBUG

# Validation-gate tolerances — PROJECT_PLAN.md §E.2 / §F / §N.5.
#
# CALIBRATED (Phase 4 close-out) against the real Telco Customer Churn
# dataset (bootstrap resampling, n_iter=3000, seed 42) — see
# docs/validation_calibration.md for the full method, evidence table, and
# decision. No longer provisional.
#
# NOT read by contract/validator.py at validation time, and never will be:
# the sole authoritative, enforced source of tolerance policy is each
# DatasetContract's own declared per-column `scale_drift`/`target.drift`
# constraints (§E.1 rule 6, "נאכף ב-Python בלבד" — enforced only from what
# the contract itself declares). These two values are a calibrated
# SUGGESTED DEFAULT for the Data Contract Architect agent to start from
# when authoring a ContractDraft (Phase 6+) — the agent still writes its
# own justification and may choose a different tolerance per column where
# the evidence for that column warrants one.
validation:
  scale_drift_median_rel_tolerance: 0.25
  target_positive_rate_tolerance_abs: 0.05

# Business context — LOCKED in Phase 2 (PROJECT_PLAN.md §J, §Phase 2).
# Full provenance, 12-criterion evidence, unit/leakage decisions, and
# measured quality issues: data/README.md. Do not restate or reinterpret
# those facts here; this block only names the selected dataset.
business_context:
  domain: customer_churn
  task_type: binary_classification
  status: locked
  dataset_name: telco_customer_churn
  dataset_source: data/README.md
